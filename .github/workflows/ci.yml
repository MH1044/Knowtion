name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Knowtion ships on all three, and the failures that matter here are
        # platform specific: path handling, line endings, and filesystem watching.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # NOTE: these are version tags, not commit SHAs. Before any workflow in this
      # repository is given access to secrets, signing keys or a release channel,
      # every action must be pinned to a full commit SHA. A mutable tag in a
      # privileged workflow is a supply-chain hole; in this unprivileged one it is not.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Licence gate
        run: npm run licences

      - name: Test with coverage
        run: npm run test:coverage

      # Every step above exercises source code in isolation; none of them ever start
      # the real Electron app, so a renderer that throws before React mounts (e.g. a
      # CSP silently blocking the app's own wasm module) would pass every one of them
      # and still exit 0. Ubuntu only for now, to keep this cheap while it proves out;
      # widen to the other two OSes once it has run clean for a while.
      - name: Install Xvfb (Linux, for the Electron launch smoke test)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E launch smoke test (Electron)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm run test:e2e
